<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — Preview</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5 9 8l4 4 7-8"/><path d="M15 4h5v5"/></svg>
        </div>
        <span>TaskFlow</span>
      </div>
      <nav>
        <ul class="sidebar-list">
          <li><a href="./dashboard.html" class="sidebar-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11.5 12 5l8 6.5"/><path d="M5 9.5V19h14v-9.5"/></svg> Dashboard</a></li>
          <li><a href="#" class="sidebar-item active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg> Tasks</a></li>
          <li><a href="./user-access.html" class="sidebar-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1"/><circle cx="10" cy="7" r="3"/><path d="M20 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 4.13a4 4 0 0 1 0 7.75"/></svg> User Access</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="muted">Task list</div>
          <h1 class="page-title">Tasks</h1>
        </div>
        <div class="topbar-actions">
          <button class="button">Sort</button>
          <button class="button-primary">Create task</button>
        </div>
      </header>

      <section class="panel" style="padding: var(--space-4);">
        <div class="toolbar">
          <div class="filter-row">
            <button class="button">All</button>
            <button class="button">Due today</button>
            <button class="button">At risk</button>
          </div>
          <input type="text" value="Search tasks" aria-label="Search tasks" style="min-width: 220px;" />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Task</th>
                <th>Owner</th>
                <th>Due date</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Launch checklist</td>
                <td>Priya</td>
                <td>Today</td>
                <td><span class="badge danger">High</span></td>
                <td><span class="badge warning">In progress</span></td>
                <td><button class="button">Done</button></td>
              </tr>
              <tr>
                <td>QA bug triage</td>
                <td>Mateo</td>
                <td>Tomorrow</td>
                <td><span class="badge warning">Medium</span></td>
                <td><span class="badge info">Review</span></td>
                <td><button class="button">Delete</button></td>
              </tr>
              <tr>
                <td>Design review</td>
                <td>Jess</td>
                <td>Thu</td>
                <td><span class="badge danger">High</span></td>
                <td><span class="badge success">Planned</span></td>
                <td><button class="button">Done</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
