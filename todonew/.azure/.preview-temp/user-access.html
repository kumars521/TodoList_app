<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Access — Preview</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5 9 8l4 4 7-8"/><path d="M15 4h5v5"/></svg>
        </div>
        <span>TaskFlow</span>
      </div>
      <nav>
        <ul class="sidebar-list">
          <li><a href="./dashboard.html" class="sidebar-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11.5 12 5l8 6.5"/><path d="M5 9.5V19h14v-9.5"/></svg> Dashboard</a></li>
          <li><a href="./tasks.html" class="sidebar-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg> Tasks</a></li>
          <li><a href="#" class="sidebar-item active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1"/><circle cx="10" cy="7" r="3"/><path d="M20 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 4.13a4 4 0 0 1 0 7.75"/></svg> User Access</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="muted">Team roles</div>
          <h1 class="page-title">User Access</h1>
        </div>
        <div class="topbar-actions">
          <button class="button-primary">Add user</button>
        </div>
      </header>

      <section class="panel" style="padding: var(--space-4); margin-bottom: var(--space-5);">
        <div class="toolbar">
          <h2>Members</h2>
          <div class="filter-row">
            <button class="button">Admins</button>
            <button class="button">Team Leads</button>
          </div>
        </div>

        <div class="user-card">
          <div class="user-meta">
            <div class="avatar">PS</div>
            <div>
              <div style="font-weight: 700;">Priya Shah</div>
              <div class="muted">Team Lead</div>
            </div>
          </div>
          <span class="badge info">Full access</span>
        </div>
        <div class="user-card">
          <div class="user-meta">
            <div class="avatar">MJ</div>
            <div>
              <div style="font-weight: 700;">Mateo Jones</div>
              <div class="muted">Operator</div>
            </div>
          </div>
          <span class="badge success">Task access</span>
        </div>
        <div class="user-card" style="border-bottom: none;">
          <div class="user-meta">
            <div class="avatar">DL</div>
            <div>
              <div style="font-weight: 700;">Daria Lee</div>
              <div class="muted">Viewer</div>
            </div>
          </div>
          <span class="badge warning">Read-only</span>
        </div>
      </section>

      <section class="panel" style="padding: var(--space-4);">
        <div class="toolbar">
          <h2>Role settings</h2>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="role">Role</label>
            <select id="role">
              <option>Team Lead</option>
              <option>Operator</option>
              <option>Viewer</option>
            </select>
          </div>
          <div class="field">
            <label for="access">Access level</label>
            <select id="access">
              <option>Full access</option>
              <option>Task access</option>
              <option>Read-only</option>
            </select>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
