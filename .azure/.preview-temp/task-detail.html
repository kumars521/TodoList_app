<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task Detail — Preview</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div class="preview-page">
    <div class="preview-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h7V5H4v7zm9 7h7v-7h-7v7zM4 19h7v-7H4v7zm9-12h7V5h-7v2z"/></svg>
          </div>
          <span>TodoNew</span>
        </div>
        <nav aria-label="Main navigation">
          <a href="./dashboard.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-8.5z"/></svg>Overview</a>
          <a href="./tasks.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Tasks</a>
          <a href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10v10H7zM10 10h4v4h-4z"/></svg>Details</a>
        </nav>
        <div class="actions">
          <button class="button primary">Save changes</button>
        </div>
      </header>

      <div class="main-column" style="padding-top:24px;">
        <section class="panel">
          <div class="panel-header">
            <div class="panel-title"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10v10H7zM10 10h4v4h-4z"/></svg></span> Sprint review and blockers summary</div>
            <span class="status-pill in-progress">In Progress</span>
          </div>
          <div class="task-detail">
            <div>
              <p>Review the current sprint, identify blockers, and ensure alignment before the next milestone review.</p>
              <div class="meta-card">
                <div class="meta-row"><span>Assignee</span><strong>Maya</strong></div>
                <div class="meta-row"><span>Due</span><strong>Today</strong></div>
                <div class="meta-row"><span>Project</span><strong>Growth</strong></div>
                <div class="meta-row"><span>Priority</span><strong>High</strong></div>
              </div>
            </div>
            <div class="meta-card">
              <div style="font-weight:700; margin-bottom:12px;">Attachments</div>
              <div style="display:grid; gap:10px;">
                <div style="border:1px solid var(--color-border); border-radius:10px; min-height:80px; display:flex; align-items:center; justify-content:center; background:rgba(37,99,235,0.04); color:var(--color-muted);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-6zM14 2v6h6"/></svg></div>
                <div style="border:1px solid var(--color-border); border-radius:10px; min-height:80px; display:flex; align-items:center; justify-content:center; background:rgba(20,184,166,0.04); color:var(--color-muted);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8M8 20h8"/></svg></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
