<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tasks — Preview</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div class="preview-page">
    <div class="preview-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h7V5H4v7zm9 7h7v-7h-7v7zM4 19h7v-7H4v7zm9-12h7V5h-7v2z"/></svg>
          </div>
          <span>TodoNew</span>
        </div>
        <nav aria-label="Main navigation">
          <a href="./dashboard.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-8.5z"/></svg>Overview</a>
          <a href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Tasks</a>
          <a href="./task-detail.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10v10H7zM10 10h4v4h-4z"/></svg>Details</a>
        </nav>
        <div class="actions">
          <button class="button primary">New item</button>
        </div>
      </header>

      <div class="dashboard-layout">
        <aside class="sidebar" aria-label="Sidebar navigation">
          <div class="sidebar-section">
            <div class="nav-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-8.5z"/></svg></span>Dashboard</div>
            <div class="nav-item active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></span>Tasks</div>
            <div class="nav-item"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10v10H7zM10 10h4v4h-4z"/></svg></span>Details</div>
          </div>
        </aside>

        <main class="main-column">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg></span> Active tasks</div>
              <button class="button">Filter</button>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Priority</th>
                  <th>Owner</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>QA regression pass</td>
                  <td>High</td>
                  <td>Maya</td>
                  <td><span class="status-pill in-progress">In Progress</span></td>
                </tr>
                <tr>
                  <td>Update customer onboarding copy</td>
                  <td>Medium</td>
                  <td>Leo</td>
                  <td><span class="status-pill todo">Todo</span></td>
                </tr>
                <tr>
                  <td>Create launch checklist</td>
                  <td>High</td>
                  <td>Priya</td>
                  <td><span class="status-pill review">Review</span></td>
                </tr>
                <tr>
                  <td>Archive completed sprint items</td>
                  <td>Low</td>
                  <td>Aiden</td>
                  <td><span class="status-pill done">Done</span></td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
